<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 30px;
            color: #1db954;
        }

        /* Add Song Section */
        .add-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .add-section input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #1a1a1a;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .add-section input:focus {
            border-color: #1db954;
        }

        .add-section button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #1db954;
            color: #000;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-section button:hover {
            background: #1ed760;
        }

        .add-section button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        /* Status message */
        .status {
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
            color: #aaa;
        }

        .status.error {
            color: #ff4444;
        }

        .status.success {
            color: #1db954;
        }

        /* Song List */
        .song-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .song-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            background: #1a1a1a;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .song-item:hover {
            background: #252525;
        }

        .song-item.active {
            background: #252525;
            border-left: 3px solid #1db954;
        }

        .song-cover {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            object-fit: cover;
            background: #333;
            flex-shrink: 0;
        }

        .song-info {
            flex: 1;
            overflow: hidden;
        }

        .song-title {
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 13px;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-delete {
            background: none;
            border: none;
            color: #666;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: color 0.2s, background 0.2s;
        }

        .song-delete:hover {
            color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
        }

        /* Player Bar */
        .player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #181818;
            border-top: 1px solid #333;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 100;
        }

        .player-cover {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            object-fit: cover;
            background: #333;
            flex-shrink: 0;
        }

        .player-info {
            flex: 1;
            min-width: 0;
        }

        .player-title {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-artist {
            font-size: 12px;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .player-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
        }

        .player-btn:hover {
            color: #1db954;
        }

        .player-progress {
            flex: 2;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: #555;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: #1db954;
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .progress-time {
            font-size: 11px;
            color: #aaa;
            min-width: 40px;
        }

        audio {
            display: none;
        }

        .empty-state {
            text-align: center;
            color: #555;
            padding: 60px 20px;
            font-size: 16px;
        }

        /* Spacing for fixed player bar */
        .spacer {
            height: 80px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Music Player</h1>

    <div class="add-section">
        <input type="text" id="urlInput" placeholder="Paste YouTube URL here..." />
        <button id="addBtn" onclick="addSong()">Add</button>
    </div>

    <div id="status" class="status" style="display:none;"></div>

    <div id="songList" class="song-list"></div>

    <div id="emptyState" class="empty-state" style="display:none;">
        No songs yet. Add a YouTube URL above to get started!
    </div>

    <div class="spacer"></div>
</div>

<div class="player" id="player" style="display:none;">
    <img class="player-cover" id="playerCover" src="" alt="" />
    <div class="player-info">
        <div class="player-title" id="playerTitle">—</div>
        <div class="player-artist" id="playerArtist">—</div>
    </div>
    <div class="player-progress">
        <span class="progress-time" id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar" onclick="seek(event)">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="progress-time" id="totalTime">0:00</span>
    </div>
    <div class="player-controls">
        <button class="player-btn" onclick="prevSong()">⏮</button>
        <button class="player-btn" id="playPauseBtn" onclick="togglePlay()">▶</button>
        <button class="player-btn" onclick="nextSong()">⏭</button>
    </div>
</div>

<audio id="audioPlayer"></audio>

<script>
    let songs = [];
    let currentIndex = -1;
    let isPlaying = false;

    const audio = document.getElementById('audioPlayer');
    const player = document.getElementById('player');

    // Format seconds to m:ss
    function formatTime(sec) {
        if (!sec || isNaN(sec)) return '0:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Load songs on page load
    async function loadSongs() {
        try {
            const res = await fetch('/api/songs');
            songs = await res.json();
            renderSongs();
        } catch (e) {
            showStatus('Failed to load songs', true);
        }
    }

    // Render song list
    function renderSongs() {
        const list = document.getElementById('songList');
        const empty = document.getElementById('emptyState');

        if (!songs.length) {
            list.innerHTML = '';
            empty.style.display = 'block';
            return;
        }

        empty.style.display = 'none';
        list.innerHTML = songs.map((song, i) => `
            <div class="song-item ${i === currentIndex ? 'active' : ''}" onclick="playSong(${i})">
                <img class="song-cover" src="${song.coverUrl || ''}" alt=""
                     onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 50 50%22><rect fill=%22%23333%22 width=%2250%22 height=%2250%22/><text x=%2225%22 y=%2230%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2220%22>♪</text></svg>'" />
                <div class="song-info">
                    <div class="song-title">${escapeHtml(song.title)}</div>
                    <div class="song-artist">${escapeHtml(song.artist)}</div>
                </div>
                <button class="song-delete" onclick="event.stopPropagation(); deleteSong(${song.id}, ${i})">✕</button>
            </div>
        `).join('');
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Add song from URL
    async function addSong() {
        const input = document.getElementById('urlInput');
        const btn = document.getElementById('addBtn');
        const url = input.value.trim();

        if (!url) return;

        btn.disabled = true;
        btn.textContent = 'Adding...';
        showStatus('Downloading audio... this may take a moment', false);

        try {
            const res = await fetch('/api/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });
            const data = await res.json();

            if (data.error) {
                showStatus(data.error, true);
            } else {
                showStatus(`Added: ${data.title} — ${data.artist}`, false, true);
                input.value = '';
                await loadSongs();
            }
        } catch (e) {
            showStatus('Network error — try again', true);
        }

        btn.disabled = false;
        btn.textContent = 'Add';
    }

    // Delete song
    async function deleteSong(id, index) {
        try {
            await fetch(`/api/songs/${id}`, { method: 'DELETE' });

            // If currently playing this song, stop or skip
            if (index === currentIndex) {
                audio.pause();
                isPlaying = false;
                if (songs.length > 1) {
                    nextSong();
                } else {
                    currentIndex = -1;
                    player.style.display = 'none';
                }
            } else if (index < currentIndex) {
                currentIndex--;
            }

            songs.splice(index, 1);
            renderSongs();
        } catch (e) {
            showStatus('Failed to delete song', true);
        }
    }

    // Play a song by index
    function playSong(index) {
        if (index < 0 || index >= songs.length) return;

        currentIndex = index;
        const song = songs[index];

        document.getElementById('playerTitle').textContent = song.title;
        document.getElementById('playerArtist').textContent = song.artist;
        document.getElementById('playerCover').src = song.coverUrl || '';

        audio.src = song.audioUrl;
        audio.play();
        isPlaying = true;
        document.getElementById('playPauseBtn').textContent = '⏸';
        player.style.display = 'flex';

        renderSongs();
    }

    function togglePlay() {
        if (isPlaying) {
            audio.pause();
            isPlaying = false;
            document.getElementById('playPauseBtn').textContent = '▶';
        } else {
            audio.play();
            isPlaying = true;
            document.getElementById('playPauseBtn').textContent = '⏸';
        }
    }

    function nextSong() {
        if (songs.length === 0) return;
        const next = (currentIndex + 1) % songs.length;
        playSong(next);
    }

    function prevSong() {
        if (songs.length === 0) return;
        const prev = (currentIndex - 1 + songs.length) % songs.length;
        playSong(prev);
    }

    function seek(event) {
        const bar = document.getElementById('progressBar');
        const rect = bar.getBoundingClientRect();
        const ratio = (event.clientX - rect.left) / rect.width;
        if (audio.duration) {
            audio.currentTime = ratio * audio.duration;
        }
    }

    // Audio events
    audio.addEventListener('timeupdate', () => {
        if (!audio.duration) return;
        const pct = (audio.currentTime / audio.duration) * 100;
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
        document.getElementById('totalTime').textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
        nextSong();
    });

    // Enter key to add
    document.getElementById('urlInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') addSong();
    });

    // Status message
    function showStatus(msg, isError = false, isSuccess = false) {
        const el = document.getElementById('status');
        el.textContent = msg;
        el.className = 'status' + (isError ? ' error' : isSuccess ? ' success' : '');
        el.style.display = 'block';
        clearTimeout(el._timeout);
        el._timeout = setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    // Init
    loadSongs();
</script>

</body>
</html>
